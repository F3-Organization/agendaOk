name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options:
          - backend
          - frontend

env:
  REGISTRY: registry.f3-software.com.br

jobs:
  build:
    name: "Build ${{ inputs.service }} (production)"
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.service }}/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/confirmazap/production/${{ inputs.service }}:latest
            ${{ env.REGISTRY }}/confirmazap/production/${{ inputs.service }}:${{ steps.vars.outputs.sha_short }}
          build-args: |
            ${{ inputs.service == 'frontend' && format('VITE_API_URL={0}', vars.VITE_API_URL) || '' }}
          cache-from: type=gha,scope=${{ inputs.service }}-production
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-production
