name: Deploy Staging

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options:
          - backend
          - frontend

env:
  REGISTRY: registry.f3-software.com.br

jobs:
  build:
    name: "Build ${{ inputs.service }} (staging)"
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Login to Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.service }}/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.REGISTRY }}/confirmazap/homologation/${{ inputs.service }}:latest
            ${{ env.REGISTRY }}/confirmazap/homologation/${{ inputs.service }}:${{ steps.vars.outputs.sha_short }}
          build-args: |
            ${{ inputs.service == 'frontend' && format('VITE_API_URL={0}', vars.VITE_API_URL) || '' }}
          cache-from: type=gha,scope=${{ inputs.service }}-staging
          cache-to: type=gha,mode=max,scope=${{ inputs.service }}-staging

      - name: Update stack image tag
        run: |
          IMAGE="${{ env.REGISTRY }}/confirmazap/homologation/${{ inputs.service }}"
          TAG="${{ steps.vars.outputs.sha_short }}"

          if [ "${{ inputs.service }}" = "backend" ]; then
            sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${TAG}|" stack.staging.yaml
          elif [ "${{ inputs.service }}" = "frontend" ]; then
            sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${TAG}|" stack.staging.yaml
          fi

      - name: Commit to dev & merge into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin dev main

          git checkout dev
          git add stack.staging.yaml
          git diff --cached --quiet && exit 0

          git commit -m "deploy(${{ inputs.service }}): update staging image to ${{ steps.vars.outputs.sha_short }}"
          git push origin dev

          git checkout main
          git merge dev --no-edit
          git push origin main
