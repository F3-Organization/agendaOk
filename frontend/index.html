<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('cz-theme');
          var theme = raw ? JSON.parse(raw).state?.theme : null;
          if (!theme) theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://confirmazap.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>ConfirmaZap — Sua recepcionista IA no WhatsApp. 24/7.</title>
    <meta name="description" content="Automatize o agendamento da sua clínica ou consultório com IA no WhatsApp. Bot inteligente que atende, agenda e envia lembretes 24/7. Reduza faltas em até 70%." />
    <meta name="keywords" content="agendamento whatsapp, bot ia, confirma consulta, lembrete automático, clínica, consultório, recepcionista virtual, confirmazap" />
    <meta name="author" content="F3 Labs" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0F172A" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://confirmazap.com" />
    <meta property="og:title" content="ConfirmaZap — Recepcionista IA no WhatsApp" />
    <meta property="og:description" content="Bot IA que atende, agenda consultas e envia lembretes automaticamente pelo WhatsApp. Feito para clínicas e consultórios." />
    <meta property="og:site_name" content="ConfirmaZap" />
    <meta property="og:locale" content="pt_BR" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ConfirmaZap — Recepcionista IA no WhatsApp" />
    <meta name="twitter:description" content="Automatize agendamentos da sua clínica com IA no WhatsApp. Reduz faltas em até 70%." />

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">

      "@context": "https://schema.org",

      "name": "ConfirmaZap",
      "applicationCategory": "BusinessApplication",

      "url": "https://confirmazap.com",
      "author": {
        "@type": "Organization",

      },
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "BRL"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
