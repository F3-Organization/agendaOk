version: "3.8"

services:
  api:
    image: registry.f3-software.com.br/confirmazap-api
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: prod
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3000}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DOMAIN=${DOMAIN}
      - FRONTEND_URL=https://${DOMAIN}
      - APP_INTERNAL_URL=http://api:3000
      - TZ=America/Manaus
      # Database (bare metal no host)
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-confirmazap}
      # Redis (container)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # JWT / Segurança
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=https://${DOMAIN}/api/auth/google/callback
      # Evolution API
      - EVO_API_KEY=${EVO_API_KEY}
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVO_SERVER_URL=http://evolution-api:8080
      # Abacate Pay (Pagamentos)
      - ABACATE_PAY_TOKEN=${ABACATE_PAY_TOKEN}
      - ABACATE_PAY_URL=${ABACATE_PAY_URL:-https://api.abacatepay.com/v2}
      - ABACATE_WEBHOOK_SECRET=${ABACATE_WEBHOOK_SECRET}
      - TRIAL_DAYS=${TRIAL_DAYS:-7}
      # SMTP (Emails)
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-no-reply@confirmazap.com}
      # Gemini AI (Bot)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      # Dados da Empresa (Fiscal / Recibos)
      - COMPANY_NAME=${COMPANY_NAME:-ConfirmaZap}
      - COMPANY_CNPJ=${COMPANY_CNPJ}
      - COMPANY_ADDRESS=${COMPANY_ADDRESS}
      - SUPPORT_WHATSAPP=${SUPPORT_WHATSAPP}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.confirmazap-api.rule=Host(`confirmazap.f3-software.com.br`)"
        - "traefik.http.routers.confirmazap-api.entrypoints=websecure"
        - "traefik.http.routers.confirmazap-api.tls=true"
        - "traefik.http.routers.confirmazap-api.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.confirmazap-api.priority=20"
        - "traefik.http.services.confirmazap-api.loadbalancer.server.port=${PORT:-3000}"
        - "traefik.http.middlewares.confirmazap-api-ratelimit.ratelimit.average=50"
        - "traefik.http.middlewares.confirmazap-api-ratelimit.ratelimit.burst=100"
        - "traefik.http.routers.confirmazap-api.middlewares=confirmazap-api-ratelimit"
    depends_on:
      - redis

  web:
    image: registry.f3-software.com.br/confirmazap/production/frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        - VITE_API_URL=https://${DOMAIN}/api
    networks:
      - traefik-public
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      labels:
        - "traefik.enable=true"
        # Rota Frontend: catch-all (prioridade menor que /api)
        - "traefik.http.routers.confirmazap-web.rule=Host(`${DOMAIN}`)"
        - "traefik.http.routers.confirmazap-web.entrypoints=websecure"
        - "traefik.http.routers.confirmazap-web.tls=true"
        - "traefik.http.routers.confirmazap-web.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.confirmazap-web.priority=10"
        - "traefik.http.services.confirmazap-web.loadbalancer.server.port=80"
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    environment:
      - SERVER_TYPE=http
      - SERVER_URL=http://evolution-api:8080
      - AUTHENTICATION_API_KEY=${EVO_API_KEY}
      - AUTHENTICATION_TYPE=apikey
      - QRCODE_LIMIT=30
      # Database (bare metal no host)
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT:-5432}/${EVO_DATABASE_NAME:-evolution}?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution-confirmazap
      # Redis
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://${REDIS_PASSWORD:+:${REDIS_PASSWORD}@}redis:6379
      - CACHE_REDIS_PREFIX_KEY=evolution
      # Persistência
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_LABELS=true
      - DATABASE_SAVE_DATA_HISTORIC=true
      - DEL_INSTANCE=false
      - WPP_LID_MODE=false
      - CONFIG_SESSION_PHONE_VERSION=${CONFIG_SESSION_PHONE_VERSION:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - internal
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    depends_on:
      - redis

volumes:
  redis_data:

networks:
  internal:
    driver: overlay
  traefik-public:
    external: true
